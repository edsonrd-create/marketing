# 1) Atualizar branch base se necessário (ajuste main -> master se for o caso)
BASE=main

# 2) Criar branch de correção
git fetch origin $BASE
git checkout -b fix/ci-add-lockfile origin/$BASE

# 3) Gerar package-lock.json (sem instalar node_modules)
npm install --package-lock-only

# 4) Substituir workflow pelo conteúdo seguro (cria/overwrite)
mkdir -p .github/workflows
cat > .github/workflows/ci.yml <<'YAML'
name: CI

on:
  push:
    branches: [master, main, 'cursor/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Validate
        run: npm run validate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-${{ github.sha }}
          path: |
            shared/dist/
            mcp-*/dist/
          retention-days: 14

      - name: Upload VERSION
        uses: actions/upload-artifact@v4
        with:
          name: version-${{ github.sha }}
          path: VERSION
          retention-days: 14
YAML

# 5) Commit e push
git add package-lock.json .github/workflows/ci.yml
git commit -m "chore(ci): add package-lock.json and configure setup-node cache-dependency-path"
git push --set-upstream origin fix/ci-add-lockfile

# 6) Criar PR (se tiver gh CLI autenticado)
if command -v gh >/dev/null 2>&1; then
  gh pr create --base "$BASE" --head fix/ci-add-lockfile \
    --title "chore(ci): add package-lock and fix setup-node cache" \
    --body "Add package-lock.json and configure setup-node to use cache-dependency-path so npm ci works in CI. Fallback maintained for safety."
else
  echo "Branch pushada. Crie um PR manualmente em: https://github.com/edsonrd-create/marketing/pull/new/fix/ci-add-lockfile"
fi
